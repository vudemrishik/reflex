worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 65;

    # ── Upstreams ──────────────────────────────────────────
    upstream auth_service {
        server auth-service:8001;
    }

    upstream game_service {
        server game-service:8002;
    }

    upstream frontend {
        server frontend:5173;
    }

    # ── Rate Limiting Zones ────────────────────────────────
    limit_req_zone $binary_remote_addr zone=auth_zone:10m  rate=5r/s;
    limit_req_zone $binary_remote_addr zone=api_zone:10m   rate=30r/s;

    server {
        listen 80;
        server_name _;

        # ── CORS headers (applied globally) ────────────────
        add_header X-Frame-Options       "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff"    always;

        # ── Auth Service (/api/auth/) ──────────────────────
        location /api/auth/ {
            limit_req zone=auth_zone burst=10 nodelay;

            # CORS preflight (same-origin in prod; needed for dev cross-origin)
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin      $http_origin always;
                add_header Access-Control-Allow-Methods     "GET, POST, OPTIONS" always;
                add_header Access-Control-Allow-Headers     "Content-Type, Authorization" always;
                add_header Access-Control-Allow-Credentials "true" always;
                add_header Content-Length 0 always;
                add_header Content-Type "text/plain" always;
                return 204;
            }

            proxy_pass         http://auth_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Cookie            $http_cookie;
            proxy_pass_header  Set-Cookie;
        }

        # ── Game Service (/api/v1/) ────────────────────────
        # NOTE: JWT validation is authoritative in game-service
        # (decode_auth_token on the HttpOnly cookie). The gateway
        # enforces rate-limits and forwards cookies; add an
        # auth_request sub-check here if edge-auth is required.
        location /api/v1/ {
            limit_req zone=api_zone burst=20 nodelay;

            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin      $http_origin always;
                add_header Access-Control-Allow-Methods     "GET, POST, OPTIONS" always;
                add_header Access-Control-Allow-Headers     "Content-Type, Authorization" always;
                add_header Access-Control-Allow-Credentials "true" always;
                add_header Content-Length 0 always;
                add_header Content-Type "text/plain" always;
                return 204;
            }

            proxy_pass         http://game_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Cookie            $http_cookie;
            proxy_pass_header  Set-Cookie;
        }

        # ── Frontend (Vite dev server) ─────────────────────
        location / {
            proxy_pass         http://frontend;
            proxy_set_header   Host             $host;
            proxy_set_header   X-Real-IP        $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade          $http_upgrade;
            proxy_set_header   Connection       "upgrade";
        }
    }
}
